name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Ensure Base Project Files
        run: |
          # Ensure package.json
          if [ ! -f "package.json" ]; then
            cat << 'JSON' > package.json
          {
            "name": "mess-mate-pro",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0",
              "firebase": "^10.8.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.2.1",
              "vite": "^5.1.4"
            }
          }
          JSON
          fi
          # Ensure index.html
          if [ ! -f "index.html" ]; then
            cat << 'HTML' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Mess Mate Pro</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML
          fi
          # Ensure capacitor.config.json
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.messmatepro.app","appName":"Mess Mate Pro","webDir":"dist","bundledWebRuntime":false}' > capacitor.config.json
          fi
      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps || npm install
          mkdir -p dist
          npm run build || npx vite build
      - name: Setup & Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-exact || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Compile Debug APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mess-Mate-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
